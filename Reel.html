// ── GRAIN OVERLAY ─────────────────────────────────────────────────────────────
function GrainOverlay() {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='g'><feTurbulence type='turbulence' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23g)'/></svg>`;
  return (
    <div style={{
      position:'fixed', inset:0, pointerEvents:'none', zIndex:9998,
      backgroundImage:`url("data:image/svg+xml,${svg}")`,
      backgroundRepeat:'repeat', opacity:0.045,
      mixBlendMode:'overlay',
      animation:'grainPulse 9s ease-in-out infinite',
    }}/>
  );
}

// ── FILM POSTER ───────────────────────────────────────────────────────────────
function FilmPoster({ film, tmdbKey }) {
  const [loaded,     setLoaded]     = useState(false);
  const [err,        setErr]        = useState(false);
  const [posterUrl,  setPosterUrl]  = useState(null);

  useEffect(() => {
    if (!tmdbKey) return;
    setPosterUrl(null); setLoaded(false); setErr(false);
    fetch(`https://api.themoviedb.org/3/find/${film.id}?api_key=${tmdbKey}&external_source=imdb_id`)
      .then(r => r.json())
      .then(d => {
        const p = d.movie_results?.[0]?.poster_path;
        if (p) setPosterUrl(`https://image.tmdb.org/t/p/w500${p}`);
        else setErr(true);
      })
      .catch(() => setErr(true));
  }, [film.id, tmdbKey]);

  const showReal = posterUrl && !err;

  return (
    <div style={{ width:'100%', height:'100%', position:'relative', overflow:'hidden', background: film.bg }}>
      {showReal && (
        <img src={posterUrl} onLoad={() => setLoaded(true)} onError={() => setErr(true)}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%',
            objectFit:'cover', opacity: loaded ? 1 : 0, transition:'opacity 0.5s ease' }} />
      )}

      {/* Abstract treatment — always rendered, fades out when real poster loads */}
      <div style={{ position:'absolute', inset:0, opacity: showReal && loaded ? 0 : 1, transition:'opacity 0.5s ease' }}>
        {/* film-leader top strip */}
        <div style={{
          position:'absolute', top:0, left:0, right:0, height:3,
          background:`linear-gradient(to right, transparent, ${film.glow}80, transparent)`,
        }}/>
        {/* Index + year */}
        <div style={{
          position:'absolute', top:22, left:22,
          fontFamily:"'JetBrains Mono',monospace", fontSize:10,
          color:film.accent, letterSpacing:'0.15em', opacity:0.7,
        }}>{film.num} ── {film.year}</div>
        {/* Director name top right */}
        <div style={{
          position:'absolute', top:22, right:22,
          fontFamily:"'JetBrains Mono',monospace", fontSize:10,
          color:film.accent, letterSpacing:'0.1em', opacity:0.4,
          textTransform:'uppercase',
        }}>{film.director.split(' ').pop()}</div>
        {/* Glowing orb */}
        <div style={{
          position:'absolute', top:'28%', left:'50%',
          transform:'translate(-50%,-50%)',
          width:180, height:180, borderRadius:'50%',
          background:`radial-gradient(circle, ${film.glow}55 0%, transparent 70%)`,
          filter:'blur(28px)',
        }}/>
        {/* Oversized italic title — texture layer */}
        <div style={{
          position:'absolute', bottom:'25%', left:-6,
          fontFamily:'var(--font-display)', fontStyle:'normal', fontWeight:'var(--font-display-weight)',
          fontSize: film.title.length > 16 ? '13vw' : '17vw',
          color:film.accent, opacity:0.1,
          whiteSpace:'nowrap', lineHeight:1, letterSpacing:'var(--font-display-tracking)',
          textTransform:'var(--font-display-transform)',
          userSelect:'none', pointerEvents:'none',

      {/* Vignette */}

        position:'absolute', bottom:0, left:0, right:0, height:'50%',

// ── SWIPE CARD ────────────────────────────────────────────────────────────────
function SwipeCard({ film, isTop, stackIndex, onSwipe, tmdbKey }) {
  const [dragState, setDragState] = useState({ x:0, y:0 });
  const dragRef    = useRef({ x:0, y:0 });
  const startRef   = useRef(null);
  const [dragging, setDragging] = useState(false);
  const [exiting,  setExiting]  = useState(null);
  const [details,  setDetails]  = useState(false);

  useEffect(() => {
    if (!dragging) return;
    const move = (e) => {
      const cx = e.clientX ?? e.touches?.[0]?.clientX;
      const cy = e.clientY ?? e.touches?.[0]?.clientY;
      if (cx == null) return;
      const dx = cx - startRef.current.x;
      const dy = cy - startRef.current.y;
      dragRef.current = { x:dx, y:dy };
      setDragState({ x:dx, y:dy });
    };
    const up = () => {
      setDragging(false);
      const { x } = dragRef.current;
      if (Math.abs(x) > 108) {
        const dir = x > 0 ? 'right' : 'left';
        setExiting(dir);
        setTimeout(() => onSwipe(dir === 'right' ? 'like' : 'pass', film), 430);
      } else {
        dragRef.current = { x:0, y:0 };
        setDragState({ x:0, y:0 });
      }
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup',   up);
    document.addEventListener('touchmove', move, { passive:true });
    document.addEventListener('touchend',  up);
    return () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup',   up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend',  up);
    };
  }, [dragging]);

  const onPointerDown = (e) => {
    if (!isTop || exiting) return;
    const cx = e.clientX ?? e.touches?.[0]?.clientX;
    const cy = e.clientY ?? e.touches?.[0]?.clientY;
    startRef.current = { x:cx, y:cy };
    dragRef.current  = { x:0,  y:0  };
    setDragging(true);
  };

  // Geometry
  const sx = dragState.x, sy = dragState.y;
  const rot = sx / 20;
  const likeOp  = Math.max(0, Math.min(1, sx / 90));
  const passOp  = Math.max(0, Math.min(1, -sx / 90));
  const stackSc = 1 - stackIndex * 0.04;
  const stackTy = stackIndex * -16;

  let tf;
  if      (exiting === 'right') tf = 'translateX(135vw) rotate(22deg)';
  else if (exiting === 'left')  tf = 'translateX(-135vw) rotate(-22deg)';
  else if (!isTop)              tf = `scale(${stackSc}) translateY(${stackTy}px)`;
  else                          tf = `translateX(${sx}px) translateY(${sy * 0.12}px) rotate(${rot}deg)`;

  const trans = dragging ? 'none' : 'transform 0.48s cubic-bezier(0.25,0.46,0.45,0.94)';

  return (
    <div style={{
      position:'absolute', inset:0,
      transform:tf, transition:trans,
      zIndex: 10 - stackIndex,
      cursor: isTop ? (dragging ? 'grabbing' : 'grab') : 'default',
      userSelect:'none',
    }}>
      <div
        style={{
          position:'absolute', inset:'0 14px',
          borderRadius:5, overflow:'hidden',
          background:'#0c0c0c',
          boxShadow:`0 30px 70px rgba(0,0,0,0.75), 0 8px 24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03)`,
        }}
        onMouseDown={onPointerDown}
        onTouchStart={onPointerDown}
      >
        {/* Poster area */}
        <div style={{ position:'absolute', inset:'0 0 118px', overflow:'hidden' }}>
          <FilmPoster film={film} tmdbKey={tmdbKey}/>
        </div>

        {/* LIKE stamp */}
        <div style={{
          position:'absolute', top:38, left:24,
          border:`2px solid ${film.accent}`,
          color:film.accent,
          fontFamily:'var(--font-display)', fontWeight:'var(--font-display-weight)',
          fontSize:18, letterSpacing:'var(--font-display-tracking)',
          padding:'3px 10px', borderRadius:2,
          opacity:likeOp, transform:'rotate(-14deg)',
          transition: dragging ? 'none' : 'opacity 0.1s',
        }}>LIKE</div>

        {/* PASS stamp */}
        <div style={{
          position:'absolute', top:38, right:24,
          border:'2px solid #6a6560', color:'#6a6560',
          fontFamily:'var(--font-display)', fontWeight:'var(--font-display-weight)',
          fontSize:18, letterSpacing:'var(--font-display-tracking)',
          padding:'3px 10px', borderRadius:2,
          opacity:passOp, transform:'rotate(14deg)',
          transition: dragging ? 'none' : 'opacity 0.1s',
        }}>PASS</div>

        {/* Info panel */}
        <div style={{
          position:'absolute', bottom:0, left:0, right:0, height:118,
          background:'#0A0A0A', borderTop:'1px solid #181818',
          padding:'14px 20px 16px', zIndex:5,
        }}>
          <div style={{
            fontFamily:'var(--font-display)', fontStyle:'normal', fontWeight:'var(--font-display-weight)',
            fontSize:24, color:'#F5F1EA', lineHeight:1.05,
            letterSpacing:'-0.01em', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis',
            marginBottom:5,
          }}>{film.title}</div>
          <div style={{
            fontFamily:"'JetBrains Mono',monospace", fontSize:10,
            color:'#5A5550', letterSpacing:'0.07em',
          }}>{film.director}</div>
          <div style={{
            fontFamily:"'JetBrains Mono',monospace", fontSize:10,
            color:'#3a3a3a', letterSpacing:'0.07em', marginTop:3,
          }}>{film.country} · {film.year}</div>
        </div>

        {/* Detail panel (swipe up) */}
        <div style={{
          position:'absolute', left:0, right:0,
          bottom: details ? 0 : -500,
          height:500,
          background:`linear-gradient(to bottom, transparent 0px, ${film.bg.slice(0, film.bg.indexOf(',') > 0 ? film.bg.indexOf(',') : 999).replace('radial-gradient(','').replace('ellipse at 38% 40%,','').trim()} 0%, #0A0A0A 60px)`,
          backdropFilter:'blur(24px) brightness(0.7)',
          backgroundColor:'rgba(8,8,8,0.92)',

// ── SWIPE DECK ────────────────────────────────────────────────────────────────
function SwipeDeck({ onMatch, tmdbKey, matchChance }) {
  const [queue,  setQueue]  = useState([...FILMS]);
  const [liked,  setLiked]  = useState([]);
  const [passed, setPassed] = useState([]);

  const handleSwipe = useCallback((dir, film) => {
    if (dir === 'like') {
      setLiked(l => [...l, film]);
      if (Math.random() * 100 < matchChance) setTimeout(() => onMatch(film), 280);
    } else {
      setPassed(p => [...p, film]);
    }
    setQueue(q => q.filter(f => f.id !== film.id));
  }, [onMatch, matchChance]);

  const forceSwipe = (dir) => {
    if (queue.length === 0) return;
    handleSwipe(dir, queue[0]);
  };

  if (queue.length === 0) return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10 }}>
      <div style={{ fontFamily:'var(--font-display)', fontStyle:'normal', fontWeight:'var(--font-display-weight)', fontSize:30, color:'#F5F1EA', letterSpacing:'var(--font-display-tracking)', textTransform:'var(--font-display-transform)' }}>That's the queue.</div>
      <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:10, color:'#3a3a3a', letterSpacing:'0.1em' }}>
        {liked.length} liked · {passed.length} passed
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column' }}>
      {/* Card stack */}
      <div style={{ flex:1, position:'relative', margin:'8px 0 4px' }}>
        {queue.slice(0,3).map((film, i) => (
          <SwipeCard key={film.id} film={film} isTop={i===0} stackIndex={i}
            onSwipe={handleSwipe} tmdbKey={tmdbKey}/>
        ))}
      </div>
      {/* Buttons */}
      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:24, padding:'10px 0 18px' }}>
        <Btn onClick={() => forceSwipe('pass')} size={56} color="#5A5550" bg="#111" border="#202020">✕</Btn>
        <Btn onClick={() => forceSwipe('like')} size={66} color="#C9A961" bg="#14100a" border="#C9A96140"
          shadow="0 0 24px #C9A96118">♥</Btn>
        <Btn size={56} color="#3a3a3a" bg="#111" border="#202020">↓</Btn>
      </div>
    </div>
  );
}

              <line x1={it.cx-it.r*0.7} y1={it.cy-it.r*0.7} x2={it.cx+it.r*0.7} y2={it.cy+it.r*0.7} strokeWidth="2.5"/>
              <line x1={it.cx+it.r*0.7} y1={it.cy-it.r*0.7} x2={it.cx-it.r*0.7} y2={it.cy+it.r*0.7} strokeWidth="2.5"/>
            </g>
          );
          if (it.type === 'frame') return (
            <g key={i} transform={`rotate(${it.rot} ${it.x+it.w/2} ${it.y+it.h/2})`}>
              <rect x={it.x} y={it.y} width={it.w} height={it.h} rx="3" strokeWidth="4"/>
              <rect x={it.x+8} y={it.y+8} width={14} height={10} rx="1" strokeWidth="2"/>
              <rect x={it.x+it.w-22} y={it.y+8} width={14} height={10} rx="1" strokeWidth="2"/>
              <rect x={it.x+8} y={it.y+it.h-18} width={14} height={10} rx="1" strokeWidth="2"/>
              <rect x={it.x+it.w-22} y={it.y+it.h-18} width={14} height={10} rx="1" strokeWidth="2"/>
            </g>
          );
          return null;
        })}
        {/* Extra loose marks */}
        <path d="M 155 160 Q 180 130 210 165" strokeWidth="5"/>
        <path d="M 50 220 Q 70 195 100 225" strokeWidth="4"/>
        <circle cx="330" cy="240" r="8" strokeWidth="0" fill={ink} opacity="0.25"/>
        <circle cx="140" cy="450" r="6" strokeWidth="0" fill={ink} opacity="0.2"/>
      </g>
    </IllusWrap>
  );
}

// ── TWEAKS ────────────────────────────────────────────────────────────────────
function TweaksPanel({ tweaks, onChange }) {
  const [pos, setPos] = useState({ x: null, y: null });
  const [dragging, setDragging] = useState(false);
  const startRef = useRef(null);
  const panelRef = useRef(null);

  // Default position bottom-right
  const left = pos.x !== null ? pos.x : undefined;
  const bottom = pos.x !== null ? undefined : 80;
  const top = pos.y !== null ? pos.y : undefined;
  const right = pos.x !== null ? undefined : 14;

  useEffect(() => {
    if (!dragging) return;
    const move = (e) => {
      const cx = e.clientX ?? e.touches?.[0]?.clientX;
      const cy = e.clientY ?? e.touches?.[0]?.clientY;
      if (cx == null) return;
      const pw = panelRef.current?.offsetWidth  || 258;
      const ph = panelRef.current?.offsetHeight || 300;
      setPos({
        x: Math.max(0, Math.min(window.innerWidth  - pw, cx - startRef.current.dx)),
        y: Math.max(0, Math.min(window.innerHeight - ph, cy - startRef.current.dy)),
      });
    };
    const up = () => setDragging(false);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', move, { passive:true });
    document.addEventListener('touchend', up);
    return () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', up);
    };
  }, [dragging]);

  const onDragStart = (e) => {
    const cx = e.clientX ?? e.touches?.[0]?.clientX;
    const cy = e.clientY ?? e.touches?.[0]?.clientY;
    const rect = panelRef.current?.getBoundingClientRect();
    startRef.current = { dx: cx - (rect?.left || 0), dy: cy - (rect?.top || 0) };
    if (pos.x === null) {
      // Initialise position from current rendered rect
      setPos({ x: rect?.left || 100, y: rect?.top || 100 });
    }
    setDragging(true);
  };

  return (
    <div ref={panelRef} style={{
      position:'absolute', zIndex:600,
      left, right, top, bottom,
      width:258, background:'#101010', border:'1px solid #222',
      borderRadius:4, boxShadow:'0 16px 48px rgba(0,0,0,0.8)',
      userSelect:'none',
    }}>
      {/* Drag handle */}
      <div
        onMouseDown={onDragStart}
        onTouchStart={onDragStart}
        style={{
          padding:'12px 20px 6px', cursor:'grab',
          display:'flex', alignItems:'center', justifyContent:'space-between',
          borderBottom:'1px solid #1a1a1a', marginBottom:12,
        }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'#3a3a3a', letterSpacing:'0.18em' }}>TWEAKS</div>
        <div style={{ display:'flex', gap:3 }}>
          {[0,1,2].map(i => <div key={i} style={{ width:16, height:2, background:'#2a2a2a', borderRadius:1 }}/>)}
        </div>
      </div>

      <div style={{ padding:'0 20px 20px' }}>
      <Label>TMDB API Key</Label>
      <input value={tweaks.tmdbKey}
        onChange={e => onChange({ ...tweaks, tmdbKey: e.target.value })}
        placeholder="TMDB API key"
        style={{
          width:'100%', background:'#0A0A0A', border:'1px solid #252525',
          borderRadius:2, padding:'8px 10px', color:'#F5F1EA',
          fontFamily:"'JetBrains Mono',monospace", fontSize:11, outline:'none',
          marginBottom:16,
        }}
      />

      <Label>Match chance: {tweaks.matchChance}%</Label>
      <input type="range" min={0} max={100} value={tweaks.matchChance}
        onChange={e => onChange({ ...tweaks, matchChance: +e.target.value })}
        style={{ marginBottom:16 }}
      />

      <Label>Landing palette</Label>
      <div style={{ display:'flex', gap:8, marginTop:4, marginBottom:16 }}>
        {Object.entries({ cobalt:'#1e3db0', coral:'#E8453C', gold:'#F0A820' }).map(([k,c]) => (
          <button key={k} onClick={() => onChange({ ...tweaks, landingPalette: k })} style={{
            flex:1, height:28, borderRadius:2, background:c, border:'none',
            cursor:'pointer', outline: tweaks.landingPalette===k ? '2px solid #F5F1EA' : '2px solid transparent',
            outlineOffset:2,
            fontFamily:"'JetBrains Mono',monospace", fontSize:9, color:'rgba(255,255,255,0.7)',
            letterSpacing:'0.08em',
          }}>{k}</button>
        ))}
      </div>

      <Label>Illustration</Label>
      <div style={{ display:'flex', gap:6, marginTop:4, marginBottom:16 }}>
        {Object.entries(ILLUS_LABELS).map(([k, label]) => (
          <button key={k} onClick={() => onChange({ ...tweaks, illustration: k })} style={{
            flex:1, height:32, borderRadius:2,
            border:`1px solid ${tweaks.illustration===k ? '#F5F1EA' : '#252525'}`,
            background: tweaks.illustration===k ? '#1e1e1e' : 'transparent',
            color: tweaks.illustration===k ? '#F5F1EA' : '#5a5a5a',
            fontFamily:"'JetBrains Mono',monospace", fontSize:8,
            letterSpacing:'0.06em', cursor:'pointer',
            textTransform:'uppercase', lineHeight:1.2, padding:'0 4px',
          }}>{label}</button>
        ))}
      </div>

      <Label>Logo font</Label>
      <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:4, marginBottom:16 }}>
        {Object.entries(LOGO_FONTS).map(([k, f]) => (
          <button key={k} onClick={() => onChange({ ...tweaks, logoFont: k })} style={{
            height:40, borderRadius:2, border:`1px solid ${tweaks.logoFont===k ? '#F5F1EA' : '#252525'}`,
            background: tweaks.logoFont===k ? '#1e1e1e' : 'transparent',
            color: tweaks.logoFont===k ? '#F5F1EA' : '#5a5a5a',
            fontFamily: f.family, fontSize: Math.min(f.size * 0.22, 18),
            fontWeight: f.weight, fontStyle: f.style,
            textTransform: f.transform,
            cursor:'pointer', letterSpacing: f.tracking,
          }}>{f.label}</button>
        ))}
      </div>

      <Label>Body font</Label>
      <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:4 }}>
        {Object.entries(BODY_FONTS).map(([k, f]) => (
          <button key={k} onClick={() => onChange({ ...tweaks, bodyFont: k })} style={{
            height:34, borderRadius:2, border:`1px solid ${tweaks.bodyFont===k ? '#F5F1EA' : '#252525'}`,
            background: tweaks.bodyFont===k ? '#1e1e1e' : 'transparent',
            color: tweaks.bodyFont===k ? '#F5F1EA' : '#5a5a5a',
            fontFamily: f.family, fontSize:13,
            cursor:'pointer',
          }}>{f.label}</button>
        ))}
      </div>
      </div>
    </div>
  );
}

function Label({ children }) {
  return <div style={{ fontFamily:'var(--font-body)', fontSize:11, color:'#6a6560', marginBottom:6 }}>{children}</div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen]     = useState('landing');
  const [moods,  setMoods]      = useState(null);
  const [match,  setMatch]      = useState(null);
  const [liked,  setLiked]      = useState([]);
  const [tweaks, setTweaks]     = useState(TWEAK_DEFAULTS);
  const [showTweaks, setShowTweaks] = useState(false);

  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode')   setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
  }, []);


  // Sync font CSS vars with tweaks
  useEffect(() => {
    const root = document.getElementById('root');
    if (!root) return;
    const lf = LOGO_FONTS[tweaks.logoFont] || LOGO_FONTS.d;
    const bf = BODY_FONTS[tweaks.bodyFont] || BODY_FONTS.a;
    root.style.setProperty('--font-display', lf.family);
    root.style.setProperty('--font-display-weight', String(lf.weight));
    root.style.setProperty('--font-display-tracking', lf.tracking || '0em');
    root.style.setProperty('--font-display-transform', lf.transform || 'none');
    root.style.setProperty('--font-body', bf.family);
  }, [tweaks.logoFont, tweaks.bodyFont]);
  const onTweakChange = (t) => {
    setTweaks(t);
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits:t }, '*');
  };

  const onMatch = (film) => {
    setMatch(film);
    setLiked(l => [...l, film]);
  };

  if (screen === 'landing') return (
    <>
      <GrainOverlay/>
      <LandingScreen onEnter={() => setScreen('moods')} palette={tweaks.landingPalette} bodyFont={tweaks.bodyFont} logoFont={tweaks.logoFont} illustration={tweaks.illustration}/>
      {showTweaks && <TweaksPanel tweaks={tweaks} onChange={onTweakChange}/>}
    </>
  );

  if (screen === 'moods') return (
    <>
      <GrainOverlay/>
      <MoodSelector onConfirm={m => { setMoods(m); setScreen('swipe'); }}/>
    </>
  );

  return (
    <>
      <GrainOverlay/>

      {screen === 'swipe' && (
        <div className="fade-in" style={{ position:'absolute', inset:'0 0 70px', display:'flex', flexDirection:'column' }}>
          {/* Mood bar */}
          <MoodBar moods={moods} onChange={setMoods}/>
          <SwipeDeck onMatch={onMatch} tmdbKey={tweaks.tmdbKey} matchChance={tweaks.matchChance}/>
        </div>
      )}

      {screen === 'room' && (
        <div className="fade-in" style={{ position:'absolute', inset:'0 0 70px' }}>
          <LiveRoomScreen tmdbKey={tweaks.tmdbKey}/>
        </div>
      )}

      {screen === 'lists' && (
        <div className="fade-in" style={{ position:'absolute', inset:'0 0 70px' }}>
          <ListsScreen liked={liked} tmdbKey={tweaks.tmdbKey}/>
        </div>
      )}

      {screen === 'profile' && (
        <div className="fade-in" style={{ position:'absolute', inset:'0 0 70px' }}>
          <ProfileScreen/>
        </div>
      )}

      <BottomNav screen={screen} onChange={setScreen}/>

      {match && (
        <MatchToast film={match}
          onDismiss={() => setMatch(null)}
          onWatch={() => { window.open(`https://www.justwatch.com/us/search?q=${encodeURIComponent(match.title)}`,'_blank'); setMatch(null); }}
        />
      )}

      {showTweaks && <TweaksPanel tweaks={tweaks} onChange={onTweakChange}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
